name: Build and UI checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ui-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise platform independent UI
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g source/ui.c tests/ui_test.c -o build/ui-test
          ./build/ui-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g source/ui_navigation.c tests/navigation_test.c -o build/navigation-test
          ./build/navigation-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g source/save_backup.c tests/save_backup_test.c -o build/save-backup-test
          ./build/save-backup-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/save_io_fault_test.c -o build/save-io-fault-test
          ./build/save-io-fault-test
          python3 tests/test_save_paths.py --output build/save-paths
      - name: Exercise script, package and exporter backends
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zlib1g-dev libssl-dev
          python3 tests/test_megatard_zh.py --output build/megatard-zh
          python3 tests/test_scripts.py --output build/scripts
          python3 tests/test_packages.py --output build/packages
          python3 tests/test_exporter.py --output build/exporter
          python3 tests/test_vehicles.py --output build/vehicles
          python3 tests/test_catalog.py --output build/catalog
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Build Nintendo Switch NRO
        run: make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: gta5save-modern-ui
          path: gta5save.nro
          if-no-files-found: error
          retention-days: 14
